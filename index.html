<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assay Lab Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222;
    }
    .container { max-width: 700px; margin: auto; padding: 20px; }
    .header {
      text-align: center;
      margin-bottom: 18px;
    }
    .header img {
      max-width: 100%;
      height: auto;
      max-height: 90px;
      display: block;
      margin: 0 auto 12px auto;
    }
    h1 {
      text-align: center;
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      color: #1a237e;
    }
    .card {
      background: white; border-radius: 14px; padding: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 16px;
    }
    button {
      border: 0; border-radius: 9px; padding: 12px 16px; cursor: pointer;
      font-size: 15px; margin: 4px;
    }
    .primary { background: #1769aa; color: white; width: 100%; font-size: 17px; }
    .secondary { background: #e8eef3; }
    .danger { background: #d9534f; color: white; }
    .success { background: #2e7d32; color: white; }
    #reader { width: 100%; display: none; margin-top: 12px; }
    .status {
      text-align: center;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 8px;
      font-weight: 500;
      color: #555;
      background: #f0f3f5;
      transition: background 0.2s, color 0.2s;
    }
    .status.success-msg {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.duplicate-msg {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      font-weight: bold;
    }
    .status.error-msg {
      background: #fff3e0;
      color: #e65100;
    }
    .count { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #f0f3f5; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; }
    .empty { text-align: center; color: #888; padding: 20px; }
    tr.duplicate-row {
      background: #ffebee;
    }
    tr.duplicate-row td:nth-child(2) {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="logo.png" alt="Assay Laboratory Logo">
    <h1>Assay Lab Barcode Scanner</h1>
  </div>

  <div class="card">
    <button id="startBtn" class="primary">SCAN BARCODE</button>
    <div id="reader"></div>
    <div id="status" class="status">Ready to scan</div>
  </div>

  <div class="card">
    <div class="count">Scanned Items: <span id="count">0</span></div>
    <table>
      <thead>
        <tr><th>No.</th><th>Barcode</th><th>Time</th><th></th></tr>
      </thead>
      <tbody id="barcodeTable"></tbody>
    </table>
    <div id="empty" class="empty">No barcodes scanned yet.</div>

    <div class="actions">
      <button id="exportBtn" class="success">EXPORT CSV</button>
      <button id="clearBtn" class="danger">CLEAR ALL</button>
    </div>
  </div>
</div>

<script>
  let scanner = null;
  let scanning = false;
  let items = JSON.parse(localStorage.getItem("barcodeItems") || "[]");

  function setStatus(message, type = "") {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = "status" + (type ? " " + type : "");
  }

  function save() {
    localStorage.setItem("barcodeItems", JSON.stringify(items));
    render();
  }

  function isDuplicate(barcode) {
    return items.some(x => x.barcode === barcode);
  }

  function render() {
    const tbody = document.getElementById("barcodeTable");
    const empty = document.getElementById("empty");
    document.getElementById("count").textContent = items.length;
    tbody.innerHTML = "";

    empty.style.display = items.length ? "none" : "block";

    // Count occurrences to highlight duplicates in the list
    const counts = {};
    items.forEach(item => {
      counts[item.barcode] = (counts[item.barcode] || 0) + 1;
    });

    items.forEach((item, index) => {
      const tr = document.createElement("tr");
      const isDup = counts[item.barcode] > 1;
      if (isDup) tr.classList.add("duplicate-row");

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><strong>${escapeHtml(item.barcode)}</strong>${isDup ? ' <span style="color:#c62828;font-size:0.85em;">(duplicate)</span>' : ''}</td>
        <td>${escapeHtml(item.time)}</td>
        <td><button class="secondary" onclick="removeItem(${index})">Delete</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
  }

  window.removeItem = function(index) {
    items.splice(index, 1);
    save();
  };

  function addBarcode(decodedText) {
    const exists = isDuplicate(decodedText);

    if (exists) {
      // Red notification for duplicate – still add the item so user can see it
      setStatus("⚠ DUPLICATE: " + decodedText + " already scanned!", "duplicate-msg");
    } else {
      setStatus("✓ Scanned: " + decodedText, "success-msg");
    }

    items.push({
      barcode: decodedText,
      time: new Date().toLocaleString()
    });
    save();
  }

  async function startScanner() {
    if (scanning) return;

    const reader = document.getElementById("reader");
    reader.style.display = "block";
    setStatus("Starting camera...", "");

    scanner = new Html5Qrcode("reader");

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 280, height: 160 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        },
        (decodedText) => {
          addBarcode(decodedText);
          // Small pause prevents the same barcode being added repeatedly.
          stopScanner();
          setTimeout(startScanner, 700);
        },
        () => {}
      );

      scanning = true;
      document.getElementById("startBtn").textContent = "STOP SCANNER";
      setStatus("Point camera at a barcode", "");
    } catch (err) {
      reader.style.display = "none";
      setStatus("Camera could not start. Check camera permission and use HTTPS.", "error-msg");
      console.error(err);
    }
  }

  async function stopScanner() {
    if (!scanner || !scanning) return;
    try { await scanner.stop(); } catch(e) {}
    scanning = false;
    document.getElementById("startBtn").textContent = "SCAN BARCODE";
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    if (scanning) stopScanner();
    else startScanner();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (confirm("Clear all scanned barcodes?")) {
      items = [];
      save();
      setStatus("List cleared", "");
    }
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    if (!items.length) {
      alert("There are no scanned barcodes to export.");
      return;
    }

    const rows = [
      ["No.", "Barcode", "Time"],
      ...items.map((x, i) => [i + 1, x.barcode, x.time])
    ];

    const csv = rows.map(row =>
      row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
    ).join("\r\n");

    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "scanned_barcodes_" +
      new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  render();
</script>
</body>
</html>
